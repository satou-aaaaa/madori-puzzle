<style>
/* 設計図：方眼の紙に、色をぬった部屋。希望の札は付せん */
:root{
  --bg:#eef0ea; --paper:#fffffb; --ink:#28313a; --ink2:#5a636c; --line:#28313a22;
  --grid:#2f5d7a; --wall:#3b4650; --ok:#2f8a5b; --ng:#c8402b; --sel:#c2412a; --gold:#d79b2c; --red2:#9b3220;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:44px}
h1{font-weight:800;font-size:21px;margin:0;letter-spacing:.04em}
h1 small{font-size:12px;letter-spacing:0;color:var(--ink2);margin-left:8px;font-weight:500}
.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);box-sizing:border-box;padding:0 8px;background:var(--paper)}
.dots{display:flex;gap:6px;flex:1;max-width:120px}
.dots{align-items:center}
.dots i{flex:1;height:6px;border-radius:3px;background:transparent;border:1.5px solid var(--ink2);box-sizing:border-box}
/* 色だけで分けない：まだ＝中が空・いま＝高い・済み＝中まで塗る */
.dots i.on{background:var(--sel);border-color:var(--sel);height:12px}.dots i.done{background:var(--ink);border-color:var(--ink)}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--grid);color:#fff;font-weight:800;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 #1d3d52}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 #1d3d52}
button.main.alt{background:#7a4e2f;box-shadow:0 4px 0 #533320}
button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a{color:var(--red2);display:inline-flex;align-items:center;min-height:44px}
/* 家 */
.plan{position:relative;background:linear-gradient(#2f5d7a14 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,#2f5d7a14 1px,transparent 1px) 0 0/12px 12px,var(--paper);border-radius:14px;padding:22px 14px 14px;border:1px solid var(--line)}
.plan .nsew{position:absolute;font-size:11px;color:var(--grid);font-weight:800}
.house{display:grid;gap:0;border:4px solid var(--wall);border-radius:4px;background:var(--wall);touch-action:manipulation}
.cell{all:unset;cursor:pointer;aspect-ratio:1.3;background:var(--paper);border:2px solid var(--wall);margin:-1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:800;position:relative;box-sizing:border-box;text-align:center;line-height:1.15}
.cell b{font-size:clamp(22px,7vw,30px);font-weight:500}
.cell.on{background:var(--c)}
.cell.sel{outline:3px solid var(--sel);outline-offset:-5px}
.cell.lock::after{content:"🔒";position:absolute;right:3px;top:2px;font-size:11px}
.cell.fix::after{content:"";position:absolute;bottom:-4px;left:30%;right:30%;height:5px;background:var(--paper)}
.cell.empty{color:var(--ink2);font-weight:500}
.house.win{animation:win .6s}
@keyframes win{30%{transform:scale(1.03)}60%{transform:scale(1.01)}}
/* 完成：部屋が北から順に弾む（手ごたえ） */
.house.win .cell.on{animation:pop .42s ease-out backwards;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes pop{0%{transform:scale(.82);filter:brightness(1.25)}60%{transform:scale(1.06)}100%{transform:none}}
/* 部屋の台 */
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px}
.rm{all:unset;cursor:pointer;box-sizing:border-box;min-height:44px;padding:4px 10px;border-radius:12px;background:var(--c);border:2px solid transparent;font-weight:800;font-size:14px;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 #28313a22}
.rm.sel{border-color:var(--sel);transform:translateY(-3px)}
/* 希望 */
.wish{display:flex;flex-direction:column;gap:4px;margin:0;padding:0;list-style:none}
.wish li{display:flex;align-items:center;gap:6px;background:#fff8c9;border-radius:8px;padding:4px 10px;font-size:14px;box-shadow:0 2px 0 #28313a14;line-height:1.35}
.wish li i{font-style:normal;width:20px;text-align:center;font-weight:800;flex:none}
.wish li.ok i{color:var(--ok)}.wish li.ng{background:#ffe1d9}.wish li.ng i{color:var(--ng)}
/* 選んだ部屋に関係する希望に印（どの希望を考えればよいか分かる。答えは言わない） */
.wish li.rel{box-shadow:inset 4px 0 0 var(--sel),0 2px 0 #28313a14}
.wish li.pop{animation:wpop .45s ease-out}
.wish li.pop i{animation:wck .45s ease-out}
@keyframes wpop{0%{background:#d6f1dd}100%{background:#fff8c9}}
@keyframes wck{0%{transform:scale(.4)}60%{transform:scale(1.5)}100%{transform:none}}
.clean{display:inline-block;align-self:center;border:2px solid var(--ok);color:var(--ok);border-radius:8px;padding:2px 10px;font-weight:800;font-size:14px;transform:rotate(-4deg);animation:stamp .4s ease-out .25s backwards}
@keyframes stamp{0%{transform:scale(1.8) rotate(-4deg);opacity:0}100%{transform:rotate(-4deg);opacity:1}}
.badge{background:var(--sel);color:#fff;border-radius:9px;padding:1px 6px;font-size:12px}
.achnext{text-align:center;font-size:13px;color:var(--ink2);margin:0}
.achnew{text-align:center;font-size:14px;font-weight:800;color:var(--red2);margin:0;animation:up .35s ease-out}
.agrp{font-size:13px;color:var(--ink2);margin:4px 0 -6px;font-weight:800;letter-spacing:.1em}
.alist{display:flex;flex-direction:column;gap:8px}
.ach{display:grid;grid-template-columns:28px 1fr auto;grid-template-areas:"ic nm pg" "ic cd cd" "ic br br";align-items:center;gap:3px 10px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.ach .ic{grid-area:ic;font-size:20px;text-align:center}
.ach b{grid-area:nm;font-size:15px}.ach small{grid-area:cd;color:var(--ink2);font-size:12px;line-height:1.4}
.ach .pg{grid-area:pg;font-size:13px;color:var(--ink2);white-space:nowrap}
.ach .bar{grid-area:br;height:5px;border-radius:3px;background:var(--line);overflow:hidden}.ach .bar i{display:block;height:100%;background:var(--grid)}
.ach.got{background:#e3eef4;border-color:#2f5d7a55}
.ach:not(.got) .ic{filter:grayscale(1);opacity:.45}
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calnav .sub{flex:0 0 52px}
.calnav b{font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--ink2);text-align:center}
.cal .c{all:unset;box-sizing:border-box;min-height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:15px;background:var(--paper);border:1px solid var(--line);position:relative;line-height:1.1;min-width:0}
.cal .c i{font-style:normal;font-size:9px;letter-spacing:-.05em;color:var(--gold)}
.cal .c.p1{background:#e3eef4}.cal .c.p2{background:#a9c6d8}.cal .c.p3{background:var(--grid);color:#fff;border-color:#1d3d52}.cal .c.p3 i{color:#ffe9a8}
.cal .c.late{background:transparent;border:1.5px dashed var(--grid);color:var(--grid)}
.cal .c.miss{cursor:pointer;border:2px dotted var(--sel);color:var(--red2);background:#fff}
.cal .c.miss i{color:var(--sel)}
.cal .c.today{border:2px solid var(--ink)}
.cal .c .hd{position:absolute;right:2px;top:1px;font-size:9px;color:var(--sel);font-weight:800}
.cal .c.p3 .hd{color:#ffe9a8}
.cal .c.off{visibility:hidden}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;font-size:12px;color:var(--ink2)}
.legend em{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:3px;border:1px solid var(--line)}
.legend .lg3{background:var(--grid)}.legend .lg2{background:#a9c6d8}html.a11y-cvd .legend .lg3{background:#0072B2}html.a11y-cvd .legend .lg2{background:#bcdcf0}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.who b{font-size:26px}
.guide{margin:0;text-align:center;font-size:14px;font-weight:700;color:var(--grid)}
.status{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-height:22px}
.verdict{background:var(--paper);border:2px solid var(--grid);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 6px 0 #28313a1c;animation:up .35s ease-out}
@keyframes up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.verdict .hd{display:flex;justify-content:center;align-items:baseline;gap:10px;font-size:22px;font-weight:800}
.stars{color:var(--gold);letter-spacing:.1em;font-size:20px}
.stars .off{color:#28313a73}
.title{font-weight:800;font-size:38px;letter-spacing:.08em;text-align:center;margin:4px 0 0}
.lead{text-align:center;color:var(--ink2);margin:0;font-size:14px;line-height:1.7}
.hero{width:min(70%,240px);margin:0 auto}
.hero .cell{font-size:10px;min-width:0;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stats b{display:block;font-size:20px}
.stats small{color:var(--ink2);font-size:12px}
.rank{text-align:center;font-size:13px;color:var(--red2)}
.share{background:var(--paper);border-radius:14px;padding:12px;white-space:pre-line;font-size:15px;line-height:1.6;text-align:center;border:1px solid var(--line)}
.shares{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.shares a,.shares button{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:14px;font-weight:800;text-decoration:none;padding:0 6px;box-sizing:border-box;font-family:inherit;cursor:pointer}
.big{font-weight:800;font-size:24px;text-align:center;margin:0}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:start}
.minis .plan{padding:6px;border-radius:8px}
.minis .cell{font-size:0;aspect-ratio:1.15;border-width:1px}
.minis .cell b{font-size:16px}
.minis .house{border-width:2px}
.minis p{margin:4px 0 0;text-align:center;font-size:12px;color:var(--ink2)}
.dex{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dex div{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:8px;min-height:44px;font-size:13px}
.dex b{font-size:26px;font-weight:500}
.dex span{font-size:12px;color:var(--ink2)}
.lv{display:flex;gap:8px;flex-wrap:wrap}
.lv button{flex:1 1 40%}
dialog{border:none;border-radius:18px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000aa}
dialog h2{margin:0 0 10px;letter-spacing:.06em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--red2);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;box-shadow:0 6px 20px #0005;max-width:90%;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
/* 希望：かなわない＝✗に加えて点線の縁（色だけで分けない） */
.wish li.ng{outline:1.5px dashed var(--ng);outline-offset:-1.5px}
/* 色の見分けを助ける（html.a11y-cvd）：カラーユニバーサルデザインの組（青 #0072B2・朱 #D55E00 系・橙 #E69F00）に替え、形を強める */
html.a11y-cvd{--ok:#0072B2;--ng:#B34A00;--sel:#B34A00}
html.a11y-cvd .wish li.ok{box-shadow:inset 0 0 0 2px #0072B2}
html.a11y-cvd .wish li.ng{background:#fde9d9;outline:2.5px dashed #B34A00}
html.a11y-cvd .wish li.rel{box-shadow:inset 6px 0 0 #E69F00,0 2px 0 #28313a14}
html.a11y-cvd .wish li.ok.rel{box-shadow:inset 6px 0 0 #E69F00,inset 0 0 0 2px #0072B2}
html.a11y-cvd .rm.sel{border:3px solid #28313a}
html.a11y-cvd .cell.sel{outline:4px dashed #28313a}
html.a11y-cvd .cal .c.p1{background:#fff;border:1.5px solid #0072B2}html.a11y-cvd .cal .c.p2{background:#bcdcf0}html.a11y-cvd .cal .c.p3{background:#0072B2;border-color:#004f7c}
html.a11y-cvd .cal .c.miss{border:2px dotted #B34A00}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* all:unset のボタン（カレンダーのます目など）でも枠が消えないよう、いちばん最後に強く書く（2026-11-04 CodeRabbit） */
:is(.icon,button,a):focus-visible{outline:2px solid var(--sel)!important;outline-offset:2px}
</style>

// ヒント：まだ答えのますにない部屋を1つ、答えのますに置いて動かせなくする（そこにあった部屋は台に戻す）
function hint() {
  if (cur.done || cur.hints >= 2) return;
  const h = cur.h, r = h.S.rooms.find((x) => movable(x) && cur.at[x] !== h.sol[x]);
  if (!r) return;
  const c = h.sol[r], other = h.S.rooms.find((x) => cur.at[x] === c); if (other) delete cur.at[other];
  cur.at[r] = c; cur.lock.push(r); cur.hints++; cur.sel = h.S.rooms.find((x) => cur.at[x] == null) || null;
  keep(); paint(); toast(`${R.ROOMS[r][0]}の場所を教えました`); check();
}
function check() {
  const h = cur.h;
  if (h.S.rooms.some((r) => cur.at[r] == null)) return;
  if (!h.q.every((q) => R.holds(q, cur.at, h.S) === true)) { if (cur.hard) toast("かなっていない希望があります"); return; }
  if (!same(load().runs[MODE])) { toast("別の画面で先に進んでいます"); return play(); }
  let saved = false;
  const s = save((s) => { const r = s.runs[MODE]; if (!same(r)) return; saved = true; r.res.push({ h: cur.hints, r: cur.mv }); r.cur = null; s.homes++; s.recent = s.recent || {}; s.recent[keyOf(cur.it)] = Date.now(); trimRecent(s); if (r.mode === "e" && r.res.length >= r.list.length - 1) r.list.push(...moreList(r.list, s.recent)); for (const x of h.S.rooms) s.rooms[x] = (s.rooms[x] || 0) + 1; });
  if (!saved) { toast("別の画面で先に進んでいます"); return play(); } // 保存できなかった完成は出さない
  cur.done = true; buzz([10, 40, 10]);
  const st = starsOf(cur.hints);
  paint(); say(`完成！星${st}つ。希望を${h.q.length}つ、全部かなえました`);
  const r = s.runs[MODE], fin = r && r.mode !== "e" && r.res.length >= r.list.length;
  $("after").innerHTML = `<div class="verdict" role="status">
    <div class="hd">完成！ ${starStr(st)}</div>
    ${cur.mv === 0 && cur.hints === 0 ? `<span class="clean" id="clean">書き直しなし</span>` : ""}
    <p class="note">希望を${h.q.length}つ、全部かなえました。</p>
    <button class="main" id="next">${fin ? "結果を見る" : "次の家へ"}</button></div>`;
  $("next").onclick = play;
  setTimeout(() => { if ($("next") && cur.done) $("next").scrollIntoView({ behavior: calm() ? "auto" : "smooth", block: "nearest" }); }, 60);
}

function finish() {
  const s = load(), run = s.runs[MODE];
  if (!run) return home();
  if (run.mode === "e") return endFinish(run);
  let first = false, newAch = [];
  const rec = recOf(run);
  save((s2) => {
    first = bank(s2, run);
    // 別のタブで同じモードの新しい回が始まっていたら、それは消さない
    const c = s2.runs[MODE]; if (c && c.date === run.date && c.id === run.id) s2.runs[MODE] = null;
    // この回のあいだに取れた実績（始めたときの一覧と比べる。前の版で始めた回は出さない）
    if (Array.isArray(run.a0)) newAch = achGot(s2).filter((id) => !run.a0.includes(id));
  });
  if (run.mode === "p") return result("p", run.date, false, { list: run.list, ...rec }, newAch);
  // あとからの日を、別のタブがその日の今日の3軒として先に記録していたら、知らせてホームへ（黙って戻らない）
  if (run.mode === "a" && !first && !(load().adays || {})[run.date]) { toast("この日は別の画面で遊び終えています"); return home(); }
  result(run.mode, run.date, first, null, newAch);
}
// とことんの終わり：建てた家の数を自己ベストと比べる（他の人との順位は出さない）
function endFinish(run) {
  const n = run.res.length; let prev = 0, newAch = [];
  save((s2) => { prev = s2.ebest || 0; s2.ebest = Math.max(prev, n); const c = s2.runs.e; if (c && c.id === run.id) s2.runs.e = null; if (Array.isArray(run.a0)) newAch = achGot(s2).filter((id) => !run.a0.includes(id)); });
  const s = load(), best = n > prev && n > 0, hints = run.res.reduce((a, x) => a + (x.h || 0), 0);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>間取りパズル<small>とことん</small></h1><span></span></header>
    <p class="big" id="eres">${n}軒 完成</p>
    ${n ? `<p class="note" id="ehint">ヒント ${hints}回</p>` : ""}
    <p class="note" id="ebest">${best ? "🎉 自己ベスト更新！" : !s.ebest ? "1軒建てると自己ベストに残ります" : `自己ベスト ${s.ebest}軒${s.ebest > n ? `（あと${s.ebest - n + 1}軒で更新）` : ""}`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    ${n ? `<div class="minis">${run.list.slice(0, n).map((it, j) => { const h = houseOf(it); return `<div>${planHtml(h, h.sol, { mini: true })}<p>${it.s === 3 ? "希望の多い家" : h.size} ${starStr(starsOf(run.res[j].h))}</p></div>`; }).join("")}</div>` : ""}
    <button class="main" id="go-e">もう一度とことん</button>
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">建てた家を見る</button></div>
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home; $("go-e").onclick = () => startRun("e"); $("go-p").onclick = practiceMenu; $("go-dex").onclick = dex;
  window.scrollTo(0, 0);
}
// 共有の文：間取り（答え）は出さない。ヒントの数だけ色を変える
const sq = (h) => (h === 0 ? "🏠" : h === 1 ? "🟨" : "🟧");
function shareText(mode, k, rec) {
  return `間取りパズル${mode === "h" ? " 上級" : ""} #${dayNo(k)} ${md(k)}\n${rec.h.map(sq).join("")}${rec.h.every((h) => h === 0) ? " ヒントなしで完成" : ""}`;
}
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec, newAch = []) {
  const s = load();
  const list = mode === "p" ? prec.list : mode === "d" || mode === "a" ? dailyList(k) : hardList(k);
  const rec = mode === "p" ? prec : bookOf(s, mode)[k];
  if (!rec) return home();
  const total = rec.h.reduce((a, b) => a + b, 0), text = shareText(mode, k, rec), late = mode === "a";
  const one = (j) => rec.h[j] === 0 && Array.isArray(rec.r) && rec.r[j] === 0;
  const showKofi = first && mode !== "p" && !late && total === 0 && !s.kofi[k + mode]; // あとから遊んだ日には出さない
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>間取りパズル<small>${mode === "d" ? `今日の3軒 #${dayNo(k)}` : late ? `#${dayNo(k)} あとから` : mode === "h" ? "上級" : "練習"}</small></h1><span></span></header>
    <p class="big">${total === 0 ? "ヒントなしで完成！" : `${list.length}軒 完成（ヒント ${total}）`}</p>
    ${newAch.length ? `<p class="achnew" id="achnew">${newAch.map((id) => `🏅 実績：${ACH.find((a) => a[0] === id)[1]}`).join("<br>")}</p>` : ""}
    ${(() => { const nx = nextAch(s); return nx ? `<p class="achnext" id="achnext">🎯 次の実績「${nx.name}」まで あと${nx.left}（${nx.n}/${nx.goal}）</p>` : ""; })()}
    <div class="minis">${list.map((it, j) => { const h = houseOf(it); return `<div>${planHtml(h, h.sol, { mini: true })}<p>${h.size} ${starStr(starsOf(rec.h[j]))}${one(j) ? "<br>書き直しなし" : ""}</p></div>`; }).join("")}</div>
    ${late ? `<p class="note">あとから遊んだ日は、カレンダーに ↺ で残ります（連続の日には数えません）。</p><button class="main alt" id="go-cal">カレンダーへ</button>` : ""}
    ${mode !== "p" && !late ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🏠ヒントなし　🟨ヒント1回　🟧ヒント2回<br>次の3軒まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode !== "p" ? `<button class="main" id="go-e">続けて遊ぶ：とことん${s.ebest ? `（ベスト ${s.ebest}軒）` : ""}</button>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：希望の多い2軒に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">建てた家を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home;
  $("go-p").onclick = practiceMenu;
  if ($("go-e")) $("go-e").onclick = () => startRun("e");
  $("go-dex").onclick = dex;
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  if ($("go-cal")) $("go-cal").onclick = () => cal(k.slice(0, 7));
  if (mode !== "p" && !late) {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
  window.scrollTo(0, 0); // 結果は上（見出し）から見せる（完成の画面の下までスクロールしたまま開かない）
}

function dex() {
  const s = load();
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>建てた家<small>${s.homes}軒</small></h1><span></span></header>
    <p class="note">これまでに置いた部屋の数です。</p>
    <div class="dex">${Object.keys(R.ROOMS).map((r) => `<div><b>${R.ROOMS[r][1]}</b>${R.ROOMS[r][0]}<span>${s.rooms[r] || 0}回</span></div>`).join("")}</div>
    ${footer()}`;
  $("back").onclick = home;
  bindFooter(); window.scrollTo(0, 0);
}

function achView() {
  const s = load(), t = tally(s), got = achGot(s);
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${got.length}/${ACH.length}</small></h1><span></span></header>
    ${AGRP.map((g, gi) => `<p class="agrp">${g}</p><div class="alist">${ACH.filter((a) => a[3] === gi).map((a) => { const ok = got.includes(a[0]), n = Math.min(t[a[4]], a[5]); return `<div class="ach${ok ? " got" : ""}" data-id="${a[0]}"><span class="ic">🏅</span><b>${a[1]}</b><span class="pg">${ok ? "達成" : `${n}/${a[5]}`}</span><small>${a[2]}</small>${ok ? "" : `<span class="bar"><i style="width:${Math.round((n / a[5]) * 100)}%"></i></span>`}</div>`; }).join("")}</div>`).join("")}
    ${footer()}`;
  $("back").onclick = home;
  bindFooter(); window.scrollTo(0, 0);
}
// 遊んだ日のカレンダー：今日の3軒の日は★（ヒントの少なさ）で色を濃く、あとから遊んだ日は ↺、取りこぼした過去7日は押すとあとから遊べる
const ymOf = (k) => k.slice(0, 7);
const ymAdd = (ym, n) => new Date(Date.UTC(+ym.slice(0, 4), +ym.slice(5, 7) - 1 + n, 1)).toISOString().slice(0, 7);
const lvOf = (rec) => { const t = rec && Array.isArray(rec.h) ? rec.h.reduce((a, b) => a + b, 0) : 9; return t === 0 ? 3 : t <= 2 ? 2 : 1; };
function cal(ym) {
  const s = load(), k = todayKey(), late = lateDays(s, k), st = streak(s.days);
  if (!ym || ym > ymOf(k)) ym = ymOf(k);
  if (ym < ymOf(EPOCH)) ym = ymOf(EPOCH);
  const y = +ym.slice(0, 4), m = +ym.slice(5, 7), dow = new Date(Date.UTC(y, m - 1, 1)).getUTCDay(), n = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const cells = [];
  for (let i = 0; i < dow; i++) cells.push(`<span class="c off"></span>`);
  for (let d = 1; d <= n; d++) {
    const key = `${ym}-${String(d).padStart(2, "0")}`, rec = s.days[key], ar = (s.adays || {})[key], hd = s.hdays[key] ? `<span class="hd">上</span>` : "";
    if (rec) { const lv = lvOf(rec); cells.push(`<span class="c p${lv}" data-k="${key}" aria-label="${m}月${d}日 星${lv}つ">${d}<i>${"★".repeat(lv)}</i>${hd}</span>`); }
    else if (ar) cells.push(`<span class="c late" data-k="${key}" aria-label="${m}月${d}日 あとから遊んだ">${d}<i>↺</i></span>`);
    else if (late.includes(key)) { const go = s.runs[runKey("a", key)]; cells.push(`<button class="c miss" data-k="${key}" aria-label="${m}月${d}日をあとから遊ぶ${go ? "（続きから）" : ""}">${d}<i>${go ? "続き" : "▶"}</i></button>`); }
    else cells.push(`<span class="c${key === k ? " today" : ""}" data-k="${key}">${d}</span>`);
  }
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>カレンダー${st >= 1 ? `<small>連続 ${st}日</small>` : ""}</h1><span></span></header>
    <div class="calnav"><button class="sub" id="prev" aria-label="前の月"${ym <= ymOf(EPOCH) ? " disabled" : ""}>‹</button><b>${y}年${m}月</b><button class="sub" id="next" aria-label="次の月"${ym >= ymOf(k) ? " disabled" : ""}>›</button></div>
    <div class="cal">${["日", "月", "火", "水", "木", "金", "土"].map((w) => `<span class="wd">${w}</span>`).join("")}${cells.join("")}</div>
    <div class="legend"><span><em class="lg3"></em>★★★ ヒントなし</span><span><em class="lg2"></em>★★ ヒント1〜2</span><span>★ ヒント3〜</span><span>▶ あとから遊べる</span><span>↺ あとから</span><span>上 上級</span></div>
    ${late.length ? `<p class="note">▶ の日は、その日の3軒をあとから遊べます（過去7日まで・連続の日には数えません）。</p>` : ""}
    ${footer()}`;
  $("back").onclick = home;
  $("prev").onclick = () => cal(ymAdd(ym, -1));
  $("next").onclick = () => cal(ymAdd(ym, 1));
  document.querySelectorAll(".cal .miss").forEach((b) => (b.onclick = () => (lateDays(load()).includes(b.dataset.k) ? startRun("a", b.dataset.k) : cal(ym)))); // 開いたまま0時を過ぎて8日前になった日は始めない
  bindFooter(); window.scrollTo(0, 0);
}

window.__md = { endlessList, moreList, lapUsed, trimRecent, freshOrder, keyOf, poolOf, RECENT, ERAMP, mode: () => MODE, runKey, R, D, dailyList, hardList, houseOf, starsOf, todayKey, dayNo, shareText, streak, load, valid, lateDays, ACH, achGot, nextAch, tally, cal, cur: () => cur, play: (m) => { if (m) MODE = m; play(); } };
home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
